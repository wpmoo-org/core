services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wpmoo_core
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wpmoo_core"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "54327:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
